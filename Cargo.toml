[workspace]
resolver = "3"
members = ["crates/*", "examples/gallery"]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "Apache-2.0"
repository = "https://github.com/polterware/ui"

[workspace.dependencies]
gpui = { version = "0.2.2", default-features = false, features = ["runtime_shaders", "font-kit"] }
polterware-assets = { path = "crates/polterware-assets", version = "0.1.0" }
polterware-motion = { path = "crates/polterware-motion", version = "0.1.0" }
polterware-theme = { path = "crates/polterware-theme", version = "0.1.0" }
polterware-ui = { path = "crates/polterware-ui", version = "0.1.0" }
polterware-window = { path = "crates/polterware-window", version = "0.1.0" }
# A sibling checkout replaces it through the workspace's .cargo/config.toml [patch].
bot-avatar = { git = "https://github.com/polterware/bot-avatar" }

[workspace.lints.rust]
# objc 0.2 msg_send! checks a `cargo-clippy` feature in the calling crate.
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(feature, values("cargo-clippy"))'] }

[profile.release]
lto = "thin"
codegen-units = 1
