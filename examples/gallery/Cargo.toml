[package]
name = "polterware-gallery"
description = "Every polterware-ui control in its variants and states: the library's catalog and visual test."
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
publish = false

[dependencies]
gpui.workspace = true
polterware-ui.workspace = true
serde_json = "1.0"
image = { version = "0.25.1", default-features = false, features = ["png"] }
subsecond = { version = "0.7.10", optional = true }
dioxus-devtools = { version = "0.7.10", optional = true, default-features = false }
futures = { version = "0.3", optional = true }

[features]
# `dx serve --hot-patch --features hot-reload` patches render code into the running gallery.
hot-reload = ["dep:subsecond", "dep:dioxus-devtools", "dep:futures"]
